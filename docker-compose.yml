services:
  # ==========================================
  # Service 1: Express REST API Backend (Amazon RDS PostgreSQL)
  # ==========================================
  backend:
    image: sathiyananth/netflix-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netflix-backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:sathiya12@database-1.cvmiik6m4svr.ap-southeast-1.rds.amazonaws.com:5432/netflix_db?schema=public
      - JWT_SECRET=super_secret_netflix_jwt_key_devops_2026
      - NODE_ENV=production
    networks:
      - netflix-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Service 2: React Frontend + Nginx Web Server
  # ==========================================
  frontend:
    image: sathiyananth/netflix-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge
