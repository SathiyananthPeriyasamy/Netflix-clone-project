version: '3.8'

services:
  # ==========================================
  # Service 1: MongoDB Database Container
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: netflix-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - netflix-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Service 2: Express REST API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netflix-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/netflix_db
      - JWT_SECRET=super_secret_netflix_jwt_key_devops_2026
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - netflix-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Service 3: React Frontend + Nginx Web Server
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netflix-frontend
    restart: always
    ports:
      - "8080:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
